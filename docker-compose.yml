# Graphos — Graph Intelligence Workspace.
# Single-node deployment. Durable state (SQLite + foundry portfolio) lives on a
# named volume so restarts/redeploys do not wipe sessions, graphs or artifacts.
# NOTE: this is a single-replica design (in-process jobs + SQLite). For
# horizontal scale, move the store to Postgres and jobs to a broker — the
# Store/run contract is already shaped for that swap.
services:
  graphos:
    build: .
    image: graphos:latest
    ports:
      - "8080:8080"
    environment:
      GRAPHOS_PORT: "8080"
      GRAPHOS_DB_PATH: /app/graphos_data/graphos.db
      # Lock down for exposure: set an API key, restrict CORS, keep foundry off.
      # GRAPHOS_API_KEY: "change-me"
      # GRAPHOS_CORS_ORIGINS: "https://app.example.com"
      GRAPHOS_ENABLE_FOUNDRY: "0"   # code-exec / self-modify endpoints OFF by default
    volumes:
      - graphos-data:/app/graphos_data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  graphos-data:
