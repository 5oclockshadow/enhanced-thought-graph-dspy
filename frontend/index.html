<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphos — Graph Intelligence Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/graphos.css">
</head>
<body>
<div class="app">

  <!-- LEFT NAV -->
  <nav class="nav" aria-label="Primary">
    <div class="nav__brand">
      <div class="nav__mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24"><g fill="#070A10"><circle cx="5" cy="6" r="2.3"/><circle cx="19" cy="7" r="2.3"/><circle cx="12" cy="18" r="2.3"/><path stroke="#070A10" stroke-width="1.6" d="M5 6 L12 18 M19 7 L12 18 M5 6 L19 7" fill="none"/></g></svg>
      </div>
      <span class="nav__name">Graphos</span>
    </div>
    <button class="nav__item is-active" data-view="workspace"><span class="nav__ic">💬</span><span>Workspace</span></button>
    <button class="nav__item" data-view="explorer"><span class="nav__ic">🕸</span><span>Graph Explorer</span></button>
    <button class="nav__item" data-view="runs"><span class="nav__ic">✦</span><span>Runs &amp; Telemetry</span></button>
    <button class="nav__item" data-view="artifacts"><span class="nav__ic">▣</span><span>Artifacts</span></button>
    <button class="nav__item" data-view="models"><span class="nav__ic">◇</span><span>Models</span></button>
    <div class="nav__spacer"></div>
    <div class="nav__status" id="nav-status">
      <span class="dot" id="status-dot"></span><span id="status-text">connecting…</span>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <header class="topbar">
      <div class="topbar__title"><span id="view-title">Workspace</span>
        <span class="topbar__sub" id="view-sub"></span></div>
      <div class="topbar__actions">
        <label class="sess">Session
          <select id="session-select" class="sess__select" aria-label="Session"></select>
        </label>
        <button class="btn-ghost" id="btn-new">+ New</button>
        <span class="backend-chip" id="backend-chip" title="Active model backend">●</span>
      </div>
    </header>
    <section class="view" id="view" aria-live="polite"></section>
  </main>

</div>
<script src="/static/graphos.js"></script>
</body>
</html>
